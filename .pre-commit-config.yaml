# 与源仓同纪律：默认 ruff 配置（无 [tool.ruff]，行长 88），auto-fix 后提交会被
# 中断——审阅修复内容后 git add -p 重提即可。
# ruff 钉版 v0.14.5：最新版（0.16.7 实测）对本仓既有 noqa 误报 RUF100 62 处，
# 属 PIPELINE.md §九「优先最新版」的例外（执法工具硬钉自身）；升版须先以
# `ruff==<new>` 全量 lint 验证零误报再动 rev。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff
        name: ruff lint (to-video)
        args: [--fix]
        files: ^(scripts|tests|assets)/
      - id: ruff-format
        name: ruff format (to-video)
        files: ^(scripts|tests|assets)/
